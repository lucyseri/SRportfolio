<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text form</title>
  <!-- style -->
  <link rel="stylesheet" href="css/text.css">
  <!-- js -->
  <script src="js/js_text.js" defer></script>
</head>
<body>
  <div id="wrap">
    <section class="txt-sec">
      <div class="sec-inner">
        <div class="enrty-area">
          <input type="text" required id="messege" name="messege">
          <label class="label-line" for="messege">Leave your Messege</label>
        </div>
      </div>
    </section>
    <section class="search-sec">
      <div class="sec-inner">
        <div class="title-con">
          <span class="prev-btn"><span class="ir_pm">뒤로가기</span></span>
          <h2>search</h2>
        </div>
        <div class="search-box">
          <label for="search">검색창</label>
          <input type="text" placeholder="Enter Your Keywords to Search" id="search">
        </div>
        <div class="tag-con">
          <div class="top-title">
            <h3>Recent</h3>
            <span class="delete-btn">Delete All</span>
          </div>
          <div class="tag-box">
            <ul></ul>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
